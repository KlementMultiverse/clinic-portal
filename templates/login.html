{% extends "base.html" %}

{% block title %}Login - Clinic Portal{% endblock %}

{% block content %}
<section>
    <article class="auth-form">
        <header>
            <h2>Login</h2>
        </header>
        <form id="login-form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <footer>
            <p>Don't have an account? <a href="/register/">Register</a></p>
        </footer>
    </article>
</section>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    const resp = await apiFetch('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: email, password: password }),
    });

    if (resp.ok) {
        const data = await resp.json();
        // If on a clinic subdomain, go to dashboard
        if (data.tenant) {
            window.location.href = '/';
            return;
        }
        // On portal — redirect to user's first clinic
        if (data.clinics && data.clinics.length > 0) {
            const clinic = data.clinics[0];
            showAlert('Welcome! Redirecting to ' + clinic.name + '...', 'success');
            setTimeout(function() {
                window.location.href = '//' + clinic.domain + ':' + window.location.port + '/';
            }, 1000);
        } else {
            showAlert('Login successful! Create a clinic workspace on the home page.', 'success');
            setTimeout(function() { window.location.href = '/'; }, 1500);
        }
    } else {
        const err = await resp.json();
        showAlert(err.message || 'Login failed.', 'error');
    }
});
</script>
{% endblock %}
