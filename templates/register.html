{% extends "base.html" %}

{% block title %}Register - Clinic Portal{% endblock %}

{% block content %}
<section>
    <article class="auth-form">
        <header>
            <h2>Register</h2>
        </header>
        <form id="register-form">
            <label for="reg-name">Name</label>
            <input type="text" id="reg-name" name="name" placeholder="Your Name" required>

            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>

            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" minlength="8" required>

            <button type="submit">Register</button>
        </form>
        <footer>
            <p>Already have an account? <a href="/login/">Login</a></p>
        </footer>
    </article>
</section>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;

    const resp = await apiFetch('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({ email: email, password: password, name: name }),
    });

    if (resp.ok) {
        showAlert('Registration successful! Please login.', 'success');
        setTimeout(function() { window.location.href = '/login/'; }, 1500);
    } else {
        const err = await resp.json();
        showAlert(err.message || 'Registration failed.', 'error');
    }
});
</script>
{% endblock %}
