[project]
name = "clinic-portal"
version = "0.1.0"
description = "Multi-tenant SaaS management portal for medical clinics"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-ninja>=1.0",
    "django-tenants>=3.6",
    "django-tenant-users>=1.0",
    "boto3>=1.34",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
